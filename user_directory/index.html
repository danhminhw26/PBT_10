<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory - CRUD</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>👥 User Directory</h1>
        <p>Quản lý danh sách người dùng</p>
      </header>

      <!-- Search Bar -->
      <div class="search-section">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Tìm theo tên hoặc email..."
          class="search-input"
        />
      </div>

      <!-- Add User Button -->
      <button id="addUserBtn" class="btn btn-primary">
        ➕ Thêm người dùng mới
      </button>

      <!-- Loading State -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>⏳ Đang tải...</p>
      </div>

      <!-- Users Grid -->
      <div id="usersGrid" class="users-grid"></div>
    </div>

    <!-- User Form Modal -->
    <div id="formModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="formTitle">Thêm người dùng mới</h2>
          <button id="closeModalBtn" class="close-btn">✕</button>
        </div>

        <form id="userForm" class="user-form">
          <div class="form-group">
            <label for="nameInput">Tên:</label>
            <input type="text" id="nameInput" required />
          </div>

          <div class="form-group">
            <label for="emailInput">Email:</label>
            <input type="email" id="emailInput" required />
          </div>

          <div class="form-group">
            <label for="phoneInput">Điện thoại:</label>
            <input type="tel" id="phoneInput" />
          </div>

          <div class="form-group">
            <label for="companyInput">Công ty:</label>
            <input type="text" id="companyInput" />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              Lưu
            </button>
            <button type="button" class="btn btn-secondary" id="cancelBtn">
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Confirm Dialog -->
    <div id="confirmDialog" class="modal hidden">
      <div class="modal-content modal-confirm">
        <h2>Xác nhận xóa</h2>
        <p>Bạn chắc chắn muốn xóa người dùng này?</p>
        <div class="form-actions">
          <button id="confirmDeleteBtn" class="btn btn-danger">Xóa</button>
          <button id="cancelDeleteBtn" class="btn btn-secondary">Hủy</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
